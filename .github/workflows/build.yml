name: CI

on:
  push:
    branches: [main, master, cross-platform]
    paths:
      - 'host/**'
      - 'extension/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A newer push to the same branch cancels the run that is still going: fewer runs, fewer artifacts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version-check script self-test
        run: python3 -m unittest discover -s tools -p "test_*.py"
      - name: Extension, host and installer versions must match
        run: python3 tools/check_versions.py

  extension:
    # Step 2.5: the extension's Native Messaging client, and proof that the native request options it builds are the ones the C# tests check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Native client tests (fake chrome object)
        run: node --test tools/test-native-client.js tools/test-native-outcome.js
      - name: Golden cases must match what the extension code produces
        run: |
          node tools/generate-native-golden.js . /tmp/GoldenCases.cs
          diff /tmp/GoldenCases.cs host/YTDLPHost.Tests/Native/GoldenCases.cs

  test:
    # The tests reference the portable YTDLPHost.Core project (no WPF), so they run on every
    # target OS. Windows + Linux now; add macos-14 once Phase 3 lands.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test host/YTDLPHost.Tests/YTDLPHost.Tests.csproj --configuration Release

  build:
    needs: [version-check, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore host/YTDLPHost/YTDLPHost.csproj

      - name: Build
        run: dotnet build host/YTDLPHost/YTDLPHost.csproj --configuration Release --no-restore

      # Self-contained, matching host/Publish.bat: users no longer need the .NET 8 runtime installed.
      - name: Publish Single File
        run: |
          dotnet publish host/YTDLPHost/YTDLPHost.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            --output ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDLPHost-Release
          path: ./publish/YTDLPHost.exe
          retention-days: 1   # only the installer job needs it, within this run
          if-no-files-found: error

  shim:
    # Step 2.4: the Native Messaging shim, published the way it ships (self-contained single file; median start-to-reply 109 ms on the owner's PC).
    # Nothing depends on this job yet; it proves the publish works and shows the exe size.
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish shim (self-contained single file)
        run: dotnet publish host/YTDLPHost.Shim/YTDLPHost.Shim.csproj --configuration Release --runtime win-x64 --output ./shim-publish

      - name: Show size
        run: Get-ChildItem ./shim-publish | Select-Object Name, Length

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-shim-win-x64
          path: ./shim-publish/ytdlp-shim.exe
          retention-days: 1   # only the installer job needs it, within this run
          if-no-files-found: error

  installer:
    # Step 2.6: builds the real setup.exe from the two published exes. This is also the only place setup.iss is ever compiled.
    needs: [build, shim]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write   # to delete the intermediate artifacts at the end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: YTDLPHost-Release
          path: host/installer/publish

      - uses: actions/download-artifact@v4
        with:
          name: ytdlp-shim-win-x64
          path: host/installer/publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: |
          Get-ChildItem host/installer/publish | Select-Object Name, Length
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" host/installer/setup.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloaderPro-Setup
          path: host/installer/Output/*.exe
          retention-days: 7
          if-no-files-found: error

      # Both exes are inside the setup now, so their artifacts can go at once instead of waiting for retention-days.
      # Only runs when everything above passed (a failed run keeps them for a day to look at); never fails the build.
      - name: Delete the intermediate artifacts
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in YTDLPHost-Release ytdlp-shim-win-x64; do
            id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq ".artifacts[] | select(.name == \"$name\") | .id")
            if [ -n "$id" ]; then gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"; fi
          done
