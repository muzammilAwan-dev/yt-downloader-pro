name: CI

on:
  push:
    branches: [main, master, cross-platform]
    paths:
      - 'host/**'
      - 'extension/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version-check script self-test
        run: python3 -m unittest discover -s tools -p "test_*.py"
      - name: Extension, host and installer versions must match
        run: python3 tools/check_versions.py

  test:
    # The tests reference the portable YTDLPHost.Core project (no WPF), so they run on every
    # target OS. Windows + Linux now; add macos-14 once Phase 3 lands.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test host/YTDLPHost.Tests/YTDLPHost.Tests.csproj --configuration Release

  build:
    needs: [version-check, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore host/YTDLPHost/YTDLPHost.csproj

      - name: Build
        run: dotnet build host/YTDLPHost/YTDLPHost.csproj --configuration Release --no-restore

      # Self-contained, matching host/Publish.bat: users no longer need the .NET 8 runtime installed.
      - name: Publish Single File
        run: |
          dotnet publish host/YTDLPHost/YTDLPHost.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            --output ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDLPHost-Release
          path: ./publish/YTDLPHost.exe
